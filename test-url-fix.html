<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL Fix Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-image { max-width: 300px; margin: 10px 0; border: 1px solid #ccc; }
        .success { color: green; }
        .error { color: red; }
    </style>
</head>
<body>
    <h1>URL Fix Test</h1>
    
    <h2>Testing Fixed URL Construction</h2>
    <div id="results"></div>
    
    <script>
        // Simulate the fixed URL construction logic
        function getStaticBaseUrl() {
            const raw = "http://localhost:8080/api"; // Simulate VITE_API_BASE
            const trimmed = String(raw).replace(/\/$/, "");
            return trimmed.endsWith("/api") ? trimmed.replace("/api", "") : trimmed;
        }
        
        function getMediaUrl(mediaItem) {
            console.log('getMediaUrl - mediaItem:', mediaItem);
            
            if (mediaItem.url) {
                if (mediaItem.url.startsWith('http://') || mediaItem.url.startsWith('https://')) {
                    return mediaItem.url;
                }
                if (mediaItem.url.startsWith('/uploads/')) {
                    const baseUrl = getStaticBaseUrl();
                    const fullUrl = `${baseUrl}${mediaItem.url}`;
                    console.log('getMediaUrl - Constructed URL from relative path:', fullUrl);
                    return fullUrl;
                }
                const baseUrl = getStaticBaseUrl();
                const fullUrl = `${baseUrl}/uploads/${mediaItem.filename}`;
                console.log('getMediaUrl - Constructed URL from filename:', fullUrl);
                return fullUrl;
            }
            return null;
        }
        
        // Test data
        const testMedia = [
            {
                filename: 'media-1755421489372-77881284.jpg',
                originalName: 'test-image.jpg',
                url: '/uploads/media-1755421489372-77881284.jpg',
                mimeType: 'image/jpeg'
            }
        ];
        
        const resultsDiv = document.getElementById('results');
        
        console.log('=== Testing Fixed URL Construction ===');
        console.log('Static Base URL:', getStaticBaseUrl());
        
        testMedia.forEach((media, index) => {
            const mediaUrl = getMediaUrl(media);
            const div = document.createElement('div');
            div.innerHTML = `
                <h3>Test ${index + 1}</h3>
                <p><strong>Original URL:</strong> ${media.url}</p>
                <p><strong>Constructed URL:</strong> <span class="${mediaUrl && !mediaUrl.includes('/api') ? 'success' : 'error'}">${mediaUrl || 'null'}</span></p>
                <p><strong>Expected:</strong> http://localhost:8080/uploads/media-1755421489372-77881284.jpg</p>
                <img src="${mediaUrl}" alt="Test Image" class="test-image" 
                     onload="console.log('✅ Image loaded successfully')"
                     onerror="console.log('❌ Image failed to load')">
                <hr>
            `;
            resultsDiv.appendChild(div);
        });
        
        console.log('=== Test Complete ===');
    </script>
</body>
</html>
