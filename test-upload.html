<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Report Upload</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, textarea, select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
        .result { margin-top: 20px; padding: 10px; border-radius: 4px; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>
    <h1>Test Report Upload with Images</h1>
    
    <form id="reportForm">
        <div class="form-group">
            <label for="fullName">Full Name:</label>
            <input type="text" id="fullName" name="fullName" value="Test User" required>
        </div>
        
        <div class="form-group">
            <label for="phone">Phone:</label>
            <input type="tel" id="phone" name="phone" value="9876543210" required>
        </div>
        
        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" value="test@example.com" required>
        </div>
        
        <div class="form-group">
            <label for="title">Report Title:</label>
            <input type="text" id="title" name="title" value="Test Report with Images" required>
        </div>
        
        <div class="form-group">
            <label for="description">Description:</label>
            <textarea id="description" name="description" rows="4" required>This is a test report to verify image upload and display functionality.</textarea>
        </div>
        
        <div class="form-group">
            <label for="category">Category:</label>
            <select id="category" name="category" required>
                <option value="Public Land">Public Land</option>
                <option value="Private Land">Private Land</option>
                <option value="Road">Road</option>
                <option value="Riverbank">Riverbank</option>
                <option value="Other">Other</option>
            </select>
        </div>
        
        <div class="form-group">
            <label for="date">Date of Observation:</label>
            <input type="date" id="date" name="date" value="2024-01-20" required>
        </div>
        
        <div class="form-group">
            <label for="lat">Latitude:</label>
            <input type="number" id="lat" name="lat" value="22.7196" step="any" required>
        </div>
        
        <div class="form-group">
            <label for="lng">Longitude:</label>
            <input type="number" id="lng" name="lng" value="75.8577" step="any" required>
        </div>
        
        <div class="form-group">
            <label for="address">Address:</label>
            <input type="text" id="address" name="address" value="Test Address, Indore" required>
        </div>
        
        <div class="form-group">
            <label for="area">Area:</label>
            <input type="text" id="area" name="area" value="Test Area" required>
        </div>
        
        <div class="form-group">
            <label for="images">Upload Images:</label>
            <input type="file" id="images" name="images" multiple accept="image/*" required>
        </div>
        
        <button type="submit">Submit Report</button>
    </form>
    
    <div id="result"></div>
    
    <script>
        document.getElementById('reportForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = new FormData();
            const form = e.target;
            
            // Add report data
            const reportData = {
                fullName: form.fullName.value,
                phone: form.phone.value,
                email: form.email.value,
                title: form.title.value,
                description: form.description.value,
                category: form.category.value,
                dateOfObservation: form.date.value,
                location: {
                    lat: parseFloat(form.lat.value),
                    lng: parseFloat(form.lng.value),
                    address: form.address.value,
                    area: form.area.value
                }
            };
            
            formData.append('reportData', JSON.stringify(reportData));
            
            // Add images
            const imageFiles = form.images.files;
            for (let i = 0; i < imageFiles.length; i++) {
                formData.append('media', imageFiles[i]);
            }
            
            try {
                const response = await fetch('http://localhost:8080/api/reports', {
                    method: 'POST',
                    body: formData
                });
                
                const result = await response.json();
                
                const resultDiv = document.getElementById('result');
                if (response.ok) {
                    resultDiv.className = 'result success';
                    resultDiv.innerHTML = `
                        <h3>✅ Report Submitted Successfully!</h3>
                        <p><strong>Report ID:</strong> ${result.report.reportId}</p>
                        <p><strong>Title:</strong> ${result.report.title}</p>
                        <p><strong>Status:</strong> ${result.report.status}</p>
                        <p><strong>Media Files:</strong> ${result.report.media ? result.report.media.length : 0}</p>
                        <p>You can now view this report in the citizen portal to test image display.</p>
                    `;
                } else {
                    resultDiv.className = 'result error';
                    resultDiv.innerHTML = `
                        <h3>❌ Error Submitting Report</h3>
                        <p><strong>Status:</strong> ${response.status}</p>
                        <p><strong>Message:</strong> ${result.message || 'Unknown error'}</p>
                    `;
                }
            } catch (error) {
                const resultDiv = document.getElementById('result');
                resultDiv.className = 'result error';
                resultDiv.innerHTML = `
                    <h3>❌ Network Error</h3>
                    <p>${error.message}</p>
                `;
            }
        });
    </script>
</body>
</html>
